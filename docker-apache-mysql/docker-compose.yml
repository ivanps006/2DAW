version: "3.8"

services:
  web:
    image: php:8.2-apache
    container_name: apache_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: DWES
      DB_USER: ivan
      DB_PASSWORD: i2v0a0n6
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge