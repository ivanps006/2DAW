<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card - Bicicleta Eléctrica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* === PRODUCT CARD COMPONENT === */
        .product-card {
            background: hsl(210, 15%, 98%);
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .product-card__image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .product-card__content {
            padding: 1.5rem;
        }

        .product-card__title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .product-card__specs {
            list-style: none;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .product-card__spec {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            color: #4a5568;
        }

        .product-card__spec::before {
            content: '✓';
            color: hsl(25, 95%, 50%);
            font-weight: 700;
        }

        .product-card__price-block {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .product-card__price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .product-card__price--original {
            font-size: 1rem;
            font-weight: 400;
            color: #9ca3af;
            text-decoration: line-through;
        }

        .product-card__cta {
            width: 100%;
            padding: 1rem 1.5rem;
            background: hsl(25, 95%, 50%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .product-card__cta:hover {
            background: hsl(25, 95%, 45%);
        }

        .product-card__cta:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <article class="product-card">
        <img 
            src="https://images.unsplash.com/photo-1571068316344-75bc76f77890?w=800&q=80" 
            alt="Bicicleta eléctrica VoltRide Pro X1 de color negro con detalles naranjas" 
            class="product-card__image"
        >
        <div class="product-card__content">
            <h2 class="product-card__title">VoltRide Pro X1</h2>
            <ul class="product-card__specs">
                <li class="product-card__spec">Batería de litio 48V - 80km de autonomía</li>
                <li class="product-card__spec">Motor brushless 500W - Velocidad máx 25 km/h</li>
                <li class="product-card__spec">Cuadro de aluminio - Peso total 22kg</li>
            </ul>
            <div class="product-card__price-block">
                <span class="product-card__price">€1.299</span>
                <span class="product-card__price--original">€1.599</span>
            </div>
            <button class="product-card__cta" type="button">
                Añadir al carrito
            </button>
        </div>
    </article>
</body>
</html>
